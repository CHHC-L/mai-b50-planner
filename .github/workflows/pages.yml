name: Deploy Pages

# Publishes web/ to GitHub Pages. Does nothing until Pages is enabled (Settings → Pages → Source: GitHub Actions)
# and the repository variable PAGES_ENABLED is set to "true" (Settings → Secrets and variables → Actions → Variables).

on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # when called right after a data update, deploy the commit it just pushed
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
